<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenny's School Quest NL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Fredoka:wght@400;500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen pixel map, a wooden top bar, parchment pop-up panels.
   One committed cozy look (no light/dark switch): every colour is set here. */
:root {
  --wood: #7a4b2a; --wood-dark: #4a2c17; --wood-light: #a8743f;
  --parch: #f6ead0; --parch-2: #ecd9b0; --ink: #2b1d16; --ink-soft: #6b5442;
  --red: #d3192c; --leaf: #3f8a3a; --sky: #4f9fd6; --gold: #f5c518; --blue: #2f6fd6;
  /* 27 Oct 2026: the pixel font is only for big titles; everything you read (buttons, numbers) uses Fredoka, a round font with clear numbers */
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Lexend", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; image-rendering: pixelated; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- top bar ---------- */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--wood-light), var(--wood)); border-bottom: 4px solid var(--wood-dark); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.brand { font-family: var(--pixel); font-weight: 700; font-size: 18px; color: var(--parch); text-shadow: 2px 2px 0 var(--wood-dark); white-space: nowrap; margin-right: 4px; }
.brand span { color: var(--gold); }
#pips { display: flex; gap: 3px; }
.pip { width: 20px; height: 20px; display: grid; place-items: center; font-family: var(--display); font-size: 12px; background: var(--wood-dark); color: var(--parch-2); border: 2px solid var(--wood-dark); }
.pip.on { background: var(--gold); color: var(--ink); }
.hud-btns { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.hbtn { font-family: var(--display); font-size: 15px; padding: 5px 9px; background: var(--parch); border: 2px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark); color: var(--ink); white-space: nowrap; }
.hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
.hbtn.glow { background: var(--gold); animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 3px 0 var(--wood-dark), 0 0 0 4px rgba(245,197,24,.55); } }
#stamps { font-size: 12px; opacity: .8; }

/* ---------- bottom prompts ---------- */
#action { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  font-family: var(--display); font-size: 20px; padding: 12px 20px; background: var(--gold); border: 3px solid var(--wood-dark); box-shadow: 0 5px 0 var(--wood-dark); max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateX(-50%) translateY(-3px); } }
#near { position: fixed; z-index: 9; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); max-width: calc(100% - 24px);
  background: rgba(43,29,22,.85); color: var(--parch); padding: 6px 10px; font-size: 14px; border-radius: 2px; }
#hint-keys { position: fixed; z-index: 8; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); color: var(--parch); background: rgba(43,29,22,.6); font-size: 12px; padding: 4px 8px; }
#toast { position: fixed; z-index: 30; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); transform: translateX(-50%); background: var(--parch); border: 3px solid var(--wood-dark); padding: 8px 14px; font-family: var(--display); font-size: 17px; box-shadow: 0 4px 0 var(--wood-dark); max-width: calc(100% - 32px); text-align: center; }
#toast.pop { animation: pop .3s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(.8); opacity: 0; } }
#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--sky); color: var(--parch); font-family: var(--pixel); font-size: 22px; text-shadow: 2px 2px 0 var(--wood-dark); padding: 16px; text-align: center; }

/* ---------- panel ---------- */
#veil { position: fixed; inset: 0; z-index: 20; background: rgba(30,20,12,.55); display: flex; align-items: center; justify-content: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.panel { position: relative; width: min(560px, 100%); max-height: 100%; min-height: 0; display: flex; flex-direction: column; background: var(--parch); border: 4px solid var(--wood-dark); box-shadow: 0 0 0 4px var(--wood-light), 0 10px 0 4px var(--wood-dark); }
.panel.wide { width: min(800px, 100%); }
.panel header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--wood); color: var(--parch); }
.panel h2 { margin: 0; font-family: var(--pixel); font-size: 22px; font-weight: 700; text-wrap: balance; flex: 1; min-width: 0; }
#panel-close { color: var(--ink); background: var(--parch); border: 2px solid var(--wood-dark); font-family: var(--display); font-size: 16px; padding: 2px 10px; }
#panel-body { min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; position: relative; }
#panel-body p { margin: 0; line-height: 1.5; }

.bubble { display: flex; gap: 10px; align-items: flex-start; background: #fff8e8; border: 2px solid var(--ink); padding: 10px 12px; position: relative; }
.bubble .who { font-family: var(--display); font-weight: 700; background: var(--sky); color: #fff; padding: 2px 6px; border: 2px solid var(--ink); flex: none; }
.bubble .who.kit { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 4px 2px; background: #e9d3a6; color: var(--ink); }
.bubble .who.kit img { width: 48px; height: 48px; display: block; image-rendering: pixelated; background: #f6ead0; border: 2px solid var(--ink); }
.bubble .who.kit span { font-size: 14px; line-height: 1; }
.bubble.from-kit { align-items: center; }
.bubble p { font-size: 17px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.opts.col { flex-direction: column; align-items: stretch; }
.btn { font-family: var(--display); font-size: 18px; padding: 8px 14px; background: #fff8e8; border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--gold); }
.btn.big { font-size: 19px; padding: 12px 16px; }
.btn.left { text-align: left; font-family: var(--body); font-size: 16px; }
.btn.ghost { background: transparent; box-shadow: none; border-style: dashed; }
.btn.danger { background: #f3c4bd; }
.btn.good { background: #bfe6a8; }
.btn.meh { background: #f4e2b8; }
.btn.on { background: var(--sky); color: #fff; }
.hint { font-size: 14px; color: var(--ink-soft); text-align: center; }
.info { background: var(--parch-2); padding: 10px 12px; border-left: 4px solid var(--wood-light); }
.info ul { margin: 6px 0; padding-left: 20px; }
.feedback { min-height: 1.5em; text-align: center; font-weight: 600; }
.bigword { font-family: var(--display); font-size: 40px; text-align: center; letter-spacing: 2px; color: var(--wood-dark); }
.center { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: #fff8e8; border: 3px solid var(--parch-2); font-size: 14px; text-align: center; }
.card .ic { font-size: 28px; }
.card.on { border-color: var(--red); background: #ffe2e2; box-shadow: 0 0 0 2px var(--red); }
.ic.big { font-size: 48px; }

.chest { width: 120px; height: 96px; position: relative; border: none; background: none; padding: 0; }
.chest .box { position: absolute; left: 10px; right: 10px; bottom: 0; height: 52px; background: var(--wood-light); border: 4px solid var(--wood-dark); box-shadow: inset 0 -10px 0 var(--wood); }
.chest .lid { position: absolute; left: 6px; right: 6px; top: 14px; height: 32px; background: var(--wood); border: 4px solid var(--wood-dark); border-radius: 16px 16px 0 0; transform-origin: bottom left; transition: transform .35s; z-index: 1; }
.chest .lid::after { content: ""; position: absolute; left: 50%; top: 18px; width: 14px; height: 14px; margin-left: -7px; background: var(--gold); border: 3px solid var(--wood-dark); }
.chest.open .lid { transform: rotate(-35deg) translateY(-8px); }
.chest:hover .lid { transform: rotate(-6deg); }
.reveal h3 { margin: 0; font-family: var(--display); font-size: 26px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 10px; border: 2px solid var(--wood-dark); background: #fff8e8; font-size: 14px; }
.chip.on { background: var(--leaf); color: #fff; }

.quests { display: grid; gap: 8px; }
.quest { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; background: #fff8e8; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood-dark); }
.quest .qn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 20px; background: var(--wood-dark); color: var(--parch); }
.quest.done .qn { background: var(--gold); color: var(--ink); }
.quest .qt { display: flex; flex-direction: column; min-width: 0; }
.quest b { font-family: var(--display); font-size: 19px; font-weight: 600; }
.quest small { font-size: 13px; color: var(--ink-soft); }
.quest em { font-size: 12px; color: var(--ink-soft); font-style: normal; opacity: .8; }

.slist { display: grid; gap: 6px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff8e8; border: 2px solid var(--wood-dark); text-align: left; }
.srow.done { background: #fff3c8; }
.roof { width: 22px; height: 16px; flex: none; clip-path: polygon(50% 0, 100% 60%, 100% 100%, 0 100%, 0 60%); border-bottom: 4px solid #efe0bd; }
.roof.big { width: 56px; height: 44px; border-bottom-width: 12px; }
.sn { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.sn b { font-family: var(--display); font-size: 17px; }
.sn small { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.st { font-family: var(--display); }

.schoolcard { display: flex; flex-direction: column; gap: 8px; }
.sc-top { display: flex; gap: 12px; align-items: center; }
.sc-top > div { min-width: 0; }
.lead { font-size: 19px; font-weight: 600; }
.meta { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.facts { margin: 0; padding-left: 20px; display: grid; gap: 4px; line-height: 1.45; }

.starburst { font-size: 64px; text-align: center; color: var(--gold); text-shadow: 3px 3px 0 var(--wood-dark); animation: spin 1s ease-out; }
@keyframes spin { from { transform: scale(.2) rotate(-180deg); } }
.stampmark { align-self: center; display: flex; flex-direction: column; align-items: center; padding: 10px 18px; border: 4px double var(--c); color: var(--c); transform: rotate(-6deg); font-family: var(--display); background: #fffdf5; animation: stampin .35s ease-out; }
.stampmark b { font-size: 24px; }
@keyframes stampin { from { transform: rotate(-6deg) scale(2); opacity: 0; } }

.passport { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.pstamp { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: #fffdf5; border: 2px dashed var(--ink-soft); font-size: 13px; text-align: center; }
.pstamp.on { border: 3px double var(--c); }
.pmark { font-size: 26px; font-family: var(--display); opacity: .4; }
.pstamp.on .pmark { opacity: 1; }

.podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 8px; max-width: 520px; margin: 0 auto; width: 100%; }
.pcol { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; transition: opacity .5s, transform .5s; }
.pcol.hide, .why.hide { opacity: 0; transform: translateY(20px); }
.medal { font-size: 34px; }
.pname { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.15; min-height: 2.3em; display: grid; place-items: end center; }
.pstars { color: #c99a00; letter-spacing: 1px; }
.pblock { width: 100%; display: grid; place-items: start center; padding-top: 6px; font-family: var(--display); font-size: 30px; color: #fff; background: var(--c); border: 4px solid var(--wood-dark); text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.p1 .pblock { height: 120px; } .p2 .pblock { height: 86px; } .p3 .pblock { height: 62px; }
.why { display: grid; gap: 10px; transition: opacity .6s, transform .6s; }
.whycard { padding: 10px 12px; background: #fffdf5; border: 3px solid var(--c); }
.whycard h3 { margin: 0 0 2px; font-family: var(--display); font-size: 20px; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 8px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(520px) rotate(540deg); } }

.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 28px 1fr 46px 18px; gap: 8px; align-items: center; }
.rk { font-family: var(--display); font-size: 18px; text-align: right; }
.rn { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rn b { font-size: 14px; }
.bar { height: 10px; background: var(--parch-2); display: block; }
.bar i { display: block; height: 100%; transition: width .6s; }
.rs { font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; }
.mv.up { color: var(--leaf); } .mv.down { color: var(--red); }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.btn.tile { font-size: 17px; overflow-wrap: anywhere; }
.btn.sel { background: var(--sky); color: #fff; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.robot-grid { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); width: min(260px, 80%); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border: 3px solid var(--wood-dark); background: #8cc463; }
.rc { border: 1px solid rgba(43,29,22,.15); }
.rc.rock { background: #8b8b8b; box-shadow: inset 0 -6px 0 #6e6e6e; }
.rc.goal { background: radial-gradient(circle, var(--gold) 0 30%, transparent 32%); }
.bot { position: absolute; left: 0; top: 0; width: 20%; height: 20%; transition: transform .3s; display: grid; place-items: center; }
.bot::after { content: ""; width: 70%; height: 70%; background: var(--blue); border: 3px solid var(--ink); box-shadow: inset 0 -5px 0 #1d4f9f; }
.prog { text-align: center; font-family: var(--display); font-size: 20px; min-height: 1.5em; letter-spacing: 2px; overflow-wrap: anywhere; }
.btn.arrow { font-size: 26px; width: 56px; }
.beat { width: 110px; height: 110px; border-radius: 50%; border: 6px solid var(--wood-dark); background: var(--parch-2); transition: background .1s, transform .1s; }
.beat.on { background: var(--gold); transform: scale(1.12); }
.beat.hit { background: var(--leaf); }
.btn.drum { font-size: 24px; padding: 16px 34px; }

.parents section { display: flex; flex-direction: column; gap: 8px; }
.parents h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.parents ol, .parents ul { margin: 0; padding-left: 22px; line-height: 1.5; }
.tablewrap { overflow-x: auto; border: 2px solid var(--wood-dark); background: #fffdf5; }
.parents table { border-collapse: collapse; font-size: 13px; min-width: 760px; }
.parents th, .parents td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--parch-2); }
.parents th { background: var(--parch-2); font-family: var(--display); font-size: 14px; }
.parents a { color: var(--blue); }
.small { font-size: 12px; color: var(--ink-soft); }
.warn { color: #9a4a00; }
.od { list-style: none; padding: 0 !important; margin: 0; }
.od li.past { opacity: .45; text-decoration: line-through; }

.hbtn .lbl { margin-left: 4px; }
.radio .card { cursor: pointer; }
.radio .card b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.radio .card small { font-size: 12px; color: var(--ink-soft); }
.radio .card.on { border-color: var(--leaf); background: #e3f5d8; box-shadow: 0 0 0 2px var(--leaf); }
.radio .card.on .ic { animation: bob2 .5s ease-in-out infinite alternate; }
@keyframes bob2 { to { transform: translateY(-3px) rotate(-6deg); } }
@media (max-width: 720px) {
  .brand { font-size: 15px; }
  .hbtn { font-size: 15px; padding: 4px 7px; }
  .hbtn .lbl { display: none; }
  .hud-btns { margin-left: 0; width: 100%; justify-content: space-between; }
  .pip { width: 17px; height: 17px; font-size: 11px; }
  .bubble p { font-size: 16px; }
  #hint-keys { display: none; }
}
/* ---------- inside schools: challenge screens ---------- */
.center-t { text-align: center; }
.factcard { padding: 10px 12px; background: #fffdf5; border: 3px solid var(--c); }
.factcard h3 { margin: 0 0 4px; font-family: var(--display); font-size: 19px; }
.clues { background: #fffdf5; border: 2px dashed var(--ink-soft); padding: 8px 12px; display: grid; gap: 4px; font-size: 16px; }
.clues b { font-family: var(--display); }
.clues .new { background: #fff3c8; font-weight: 600; }
.keybox { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.keybox span { border: 2px solid var(--wood-dark); padding: 2px 7px; background: #fff8e8; font-family: var(--display); font-size: 16px; }
.keybox span.new { background: var(--gold); }
.kwt-goals { display: grid; gap: 6px; }
.goal { display: flex; gap: 10px; align-items: center; background: #fff8e8; border: 2px solid var(--wood-dark); padding: 6px 10px; font-size: 15px; line-height: 1.35; }
.goal .ic { font-size: 22px; flex: none; }
.kwt-days { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.kday { display: flex; flex-direction: column; gap: 6px; background: var(--parch-2); padding: 8px; min-width: 0; }
.kday h4 { margin: 0; font-family: var(--display); font-size: 17px; }
.kwt-days.compact .kday { font-size: 14px; }
.kopt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font-size: 14px; padding: 6px 8px; background: #fff8e8; border: 2px solid var(--wood-dark); box-shadow: 0 2px 0 var(--wood-dark); }
.kopt small { font-size: 12px; color: var(--ink-soft); }
.kopt.on { background: var(--leaf); color: #fff; }
.kopt.on small { color: #e8ffe0; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checklist li { padding: 6px 10px; background: #fff8e8; border-left: 4px solid var(--leaf); line-height: 1.4; }
.checklist li.miss { border-left-color: #c99a00; }
.tank { position: relative; width: 170px; height: 180px; margin: 0 auto; border: 4px solid #3d6f94; border-top: none; background: linear-gradient(#ffffff00 24%, #8fd0f2 24%); overflow: hidden; }
.tank.salt { background: linear-gradient(#ffffff00 24%, #b8e6e0 24%); }
.tank .tlabel { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 12px; color: #1d4f6f; font-weight: 600; }
.tank .obj { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-size: 40px; line-height: 1; transition: top 1s cubic-bezier(.3, 1.35, .6, 1); }
.tank .obj.float { top: 14%; }
.tank .obj.sink { top: calc(100% - 66px); }
.booths .booth { gap: 3px; }
.booths .booth b { font-family: var(--display); font-size: 16px; font-weight: 600; }
.booths .booth small { font-size: 12px; color: var(--ink-soft); }
.card.on small { color: var(--ink); }
.card:disabled { opacity: .45; }
